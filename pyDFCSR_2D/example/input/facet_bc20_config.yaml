# FACET-II BC20, generated by pyDFCSR_2D/test/facet_bc20/build_bc20_input.py
input_beam:
  style: from_file
  beamfile: input/facet_bc20_beam.txt
  charge: 1.6000000000003584e-09
  energy: 10116234030.01603
input_lattice:
  lattice_input_file: input/facet_bc20_lattice.yaml
step_control:
  mode: auto
  kick_interval: midpoint
particle_deposition:
  method: bspline_comoving
  xbins: 300
  zbins: 300
  xlim: 5
  zlim: 5
  smoothing_sigma: 3.0
  poly_degree: 1
  velocity_threhold: 1000
CSR_integration:
  n_formation_length: 1
  xbins: 200
  zbins: 200
CSR_computation:
  compute_CSR: 1
  apply_CSR: 1
  transverse_on: 1
  xbins: 12
  zbins: 40
  xlim: 4
  zlim: 4
  write_beam: null
  write_wakes: true
  write_name: facet_bc20
  workdir: ./output
