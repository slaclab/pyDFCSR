input_beam:
  style: distgen
  distgen_input_file: input/chicane_init_beam.yaml

input_lattice:
  lattice_input_file: input/chicane_lattice_fine.yaml

particle_deposition:
  xbins: 300
  zbins: 300
  xlim:  5
  zlim: 5
  filter_order: 1
  filter_window: 9
  velocity_threhold : 1000
  upper_limit: 2000

CSR_integration:
  n_formation_length: 1
  zbins: 200
  xbins: 200

CSR_computation:
  compute_CSR: 1
  apply_CSR: 1
  transverse_on: 1
  xbins: 10
  zbins: 30
  xlim: 3
  zlim: 3
  write_beam: [1]
  write_wakes: True
  write_name: 'chicane_fine'
  workdir: './output'
