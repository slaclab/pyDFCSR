CSR_computation:
  apply_CSR: 1
  compute_CSR: 1
  transverse_on: 1
  workdir: ./output
  write_beam: null
  write_name: ts_m20
  write_wakes: true
  xbins: 12
  xlim: 4
  zbins: 40
  zlim: 4
CSR_integration:
  n_formation_length: 1.5
  xbins: 100
  zbins: 100
input_beam:
  distgen_input_file: input/ts_m20_beam.yaml
  style: distgen
input_lattice:
  lattice_input_file: input/dipole_lattice.yaml
particle_deposition:
  frame_blend: orient
  method: bspline_comoving
  poly_degree: 1
  smoothing_sigma: 3.0
  velocity_threhold: 1000
  xbins: 200
  xlim: 5
  zbins: 200
  zlim: 5
step_control:
  kick_interval: midpoint
  mode: auto
  n_sub: 400
